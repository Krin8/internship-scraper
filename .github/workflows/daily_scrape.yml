name: Daily Internship Scraper

on:
  schedule:
    - cron: '30 15 * * *' # Runs at 15:30 UTC, which is 21:00 (9 PM) IST
  workflow_dispatch: # Allows manual trigger from the GitHub UI

permissions:
  contents: write # Needed to commit the report and state back

jobs:
  scrape:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        python -m playwright install --with-deps chromium

    - name: Run daily scanner
      run: python daily_scanner.py

    - name: Commit and push changes
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git add .
        git commit -m "docs: Automated daily internship report update" || echo "No changes to commit"
        git push

    - name: Send email report
      uses: dawidd6/action-send-mail@v3
      with:
        server_address: smtp.gmail.com
        server_port: 465
        secure: true
        username: ${{ secrets.MAIL_USERNAME }}
        password: ${{ secrets.MAIL_PASSWORD }}
        subject: Daily Internship Scraper Report
        to: navneetbavineni@gmail.com
        from: Internship Scraper Action
        body: file://daily_report.md
